<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTU 男排盃 - 賽程查詢</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        button.active {
            background: #764ba2;
        }

        .content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .schedule-table thead {
            background: #667eea;
            color: white;
        }

        .schedule-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .schedule-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .schedule-table tr:hover {
            background: #f5f5f5;
        }

        .match-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .match-status.completed {
            background: #d4edda;
            color: #155724;
        }

        .match-status.upcoming {
            background: #fff3cd;
            color: #856404;
        }

        .ranking-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ranking-table thead {
            background: #667eea;
            color: white;
        }

        .ranking-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        .ranking-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }

        .ranking-table tr:hover {
            background: #f5f5f5;
        }

        .rank-num {
            font-weight: 600;
            color: #667eea;
            font-size: 1.2em;
        }

        .group-section {
            margin-bottom: 30px;
        }

        .group-title {
            background: #667eea;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .team-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .team-card {
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .team-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .team-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .team-group {
            font-size: 0.9em;
            color: #666;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .tab-buttons {
                flex-wrap: wrap;
            }

            .schedule-table {
                font-size: 0.9em;
            }

            .schedule-table th,
            .schedule-table td {
                padding: 8px;
            }

            .team-list {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-size: 1.1em;
        }

        .score-display {
            font-weight: 600;
            color: #333;
        }

        .official-name {
            font-size: 0.9em;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏐 NTU 男排盃</h1>
            <p>賽程查詢系統</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋隊伍名稱...">
            </div>
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('schedule')">賽程表</button>
                <button class="tab-btn" onclick="switchTab('ranking')">戰績排名</button>
                <button class="tab-btn" onclick="switchTab('teams')">隊伍分組</button>
            </div>
        </div>

        <div class="content">
            <div id="loading" class="loading">⏳ 正在加載數據...</div>
            <div id="error" class="error" style="display:none;"></div>

            <div id="schedule" class="tab-content active">
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>A隊</th>
                            <th>B隊</th>
                            <th>成績</th>
                            <th>狀態</th>
                            <th>主判</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <tr><td colspan="6" class="no-data">加載中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="ranking" class="tab-content">
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>隊伍</th>
                            <th>分組</th>
                            <th>勝場</th>
                            <th>負場</th>
                        </tr>
                    </thead>
                    <tbody id="rankingBody">
                        <tr><td colspan="5" class="no-data">加載中...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="teams" class="tab-content">
                <div id="teamsContainer">
                    <div class="no-data">加載中...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allData = null;
        let filteredData = null;

        const GITHUB_USERNAME = 'ethanma951122-ui';
        const GITHUB_REPO = 'ntucup';
