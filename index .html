<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTU 男排盃 - 賽程查詢</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { background: #667eea; color: white; padding: 30px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .controls { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 200px; }
        .search-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #764ba2; }
        .content { background: white; padding: 20px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #667eea; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f5f5f5; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .no-data { text-align: center; color: #999; padding: 40px; }
        .group-section { margin-bottom: 30px; }
        .group-title { background: #667eea; color: white; padding: 15px; border-radius: 5px; margin-bottom: 15px; font-weight: bold; }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .team-card { background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #ddd; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>🏐 NTU 男排盃</h1><p>賽程查詢系統</p></header>
        <div class="controls">
            <div class="search-box"><input type="text" id="searchInput" placeholder="搜尋隊伍..."></div>
            <button onclick="switchTab('schedule')">賽程表</button>
            <button onclick="switchTab('ranking')">排名</button>
            <button onclick="switchTab('teams')">分組</button>
        </div>
        <div class="content">
            <div id="loading">⏳ 加載中...</div>
            <div id="schedule" class="tab-content active"><table><thead><tr><th>日期</th><th>A隊</th><th>B隊</th><th>成績</th><th>狀態</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
            <div id="ranking" class="tab-content"><table><thead><tr><th>排名</th><th>隊伍</th><th>勝</th><th>負</th></tr></thead><tbody id="rankingBody"></tbody></table></div>
            <div id="teams" class="tab-content"><div id="teamsContainer"></div></div>
        </div>
    </div>
    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/ethanma951122-ui/ntucup/main/data.json';
        let allData = null;

        async function init() {
            try {
                const response = await fetch(DATA_URL);
                const rawData = await response.json();
                allData = parseData(rawData);
                document.getElementById('loading').style.display = 'none';
                renderSchedule();
                renderRanking();
                renderTeams();
            } catch (e) {
                document.getElementById('loading').innerHTML = '❌ 無法加載數據';
            }
        }

        function parseData(rawData) {
            const parse = (v) => typeof v === 'string' ? JSON.parse(v) : v;
            return {
                teams: parse(rawData.teams || '{}'),
                newbieTeams: parse(rawData.newbieTeams || '{}'),
                matches: parse(rawData.matches || '[]'),
            };
        }

        function renderSchedule() {
            const body = document.getElementById('scheduleBody');
            let matches = allData.matches;
            const term = document.getElementById('searchInput').value.toLowerCase();
            if (term) matches = matches.filter(m => (m.teamAID?.toLowerCase().includes(term)) || (m.teamBID?.toLowerCase().includes(term)));
            
            body.innerHTML = matches.length ? matches.map(m => {
                const score = m.status ? `${m.set1[0]}-${m.set1[1]}, ${m.set2[0]}-${m.set2[1]}, ${m.set3[0]}-${m.set3[1]}` : '-';
                return `<tr><td>${m.date || '-'}</td><td>${m.teamAID || '-'}</td><td>${m.teamBID || '-'}</td><td>${score}</td><td>${m.status ? '✅' : '⏳'}</td></tr>`;
            }).join('') : '<tr><td colspan="5" class="no-data">沒有比賽</td></tr>';
        }

        function renderRanking() {
            const body = document.getElementById('rankingBody');
            const stats = {};
            const allTeams = { ...allData.teams, ...allData.newbieTeams };
            Object.keys(allTeams).forEach(t => stats[t] = { w: 0, l: 0 });
            allData.matches.forEach(m => {
                if (m.status && m.winner) {
                    if (m.teamAID && stats[m.teamAID]) stats[m.teamAID][m.winner === m.teamAID ? 'w' : 'l']++;
                    if (m.teamBID && stats[m.teamBID]) stats[m.teamBID][m.winner === m.teamBID ? 'w' : 'l']++;
                }
            });
            const ranking = Object.entries(stats).filter(([,s]) => s.w + s.l > 0).sort(([,a], [,b]) => b.w - a.w || a.l - b.l);
            body.innerHTML = ranking.length ? ranking.map(([t, s], i) => `<tr><td>#${i+1}</td><td>${t}</td><td>${s.w}</td><td>${s.l}</td></tr>`).join('') : '<tr><td colspan="4" class="no-data">暫無數據</td></tr>';
        }

        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            const allTeams = { ...allData.teams, ...allData.newbieTeams };
            const groups = {};
            Object.entries(allTeams).forEach(([t, d]) => {
                const g = d.preliminaryGroup || '未分組';
                (groups[g] ||= []).push(t);
            });
            container.innerHTML = Object.entries(groups).map(([g, teams]) => `
                <div class="group-section">
                    <div class="group-title">📍 ${g}</div>
                    <div class="team-grid">${teams.map(t => `<div class="team-card">${t}</div>`).join('')}</div>
                </div>
            `).join('');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
        }

        document.getElementById('searchInput').addEventListener('input', renderSchedule);
        init();
    </script>
</body>
</html>
